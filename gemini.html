  function handlePinDigit(digit) {
    const m = ui.modal;
    if (!m || m.type !== "pin") return;
    if (digit === "back") {
      m.input = m.input.slice(0, -1);
      m.error = false;
      render();
      return;
    }
    if (m.input.length >= 4) return;
    m.input += digit;
    if (m.input.length === 4) {
      if (m.input === state.parentPin) {
        if (m.purpose === "setBalance") {
          ui.modal = { type: "setBalance", input: "", statusMsg: "" };
        } else {
          ui.modal = { type: "settings", errorMsg: "" };
        }
      } else {
        m.error = true;
        triggerHaptic(60);
        render();
        setTimeout(() => {
          if (ui.modal && ui.modal.type === "pin") {
            ui.modal.input = "";
            ui.modal.error = false;
            render();
          }
        }, 420);
        return;
      }
    }
    render();
  }

  function handleSetBalanceKey(key) {
    const m = ui.modal;
    if (!m || m.type !== "setBalance") return;
    m.statusMsg = "";
    if (key === "back") {
      m.input = m.input.slice(0, -1);
    } else if (key === ".") {
      if (!m.input.includes(".")) {
        m.input = m.input === "" ? "0." : m.input + ".";
      }
    } else {
      // Digit 0-9
      const parts = m.input.split(".");
      if (parts.length === 2 && parts[1].length >= 2) return;
      const candidate = m.input + key;
      const parsed = parseDollarInput(candidate);
      if (parsed !== null && parsed <= MAX_CENTS) {
        m.input = candidate;
      }
    }
    render();
  }

  function saveNewKidBalance(explicitCents = null) {
    const m = ui.modal;
    const kid = getActiveKid();
    const newCents = explicitCents !== null ? explicitCents : parseDollarInput(m && m.input ? m.input : "0");
    if (newCents === null) return;

    if (newCents === kid.balanceCents) {
      if (m) m.statusMsg = "Same balance — nothing changed.";
      render();
      return;
    }

    kid.prevBalanceCents = kid.balanceCents;
    kid.prevUpdatedAt = kid.updatedAt;
    kid.balanceCents = newCents;
    kid.updatedAt = new Date().toISOString();
    kid.unseenChange = false;
    saveState();

    ui.modal = null;
    ui.preview = null;
    ui.countedBillCount = 0;
    ui.view = "counter";
    ui.replayAnim = true;
    playPaperRiffle();
    render();
  }

  // ============================================================
  // 6. WAD GESTURE CONTROLLER (Pointer Events + Angle/Velocity)
  // ============================================================
  let activePointer = null;

  function attachWadGestures(arenaEl) {
    if (!arenaEl) return;

    arenaEl.addEventListener("pointerdown", (e) => {
      unlockGesture();
      if (activePointer !== null) return;
      const kid = getActiveKid();
      const { bills } = breakdownCents(getEffectiveBalanceCents(kid));
      if (bills.length === 0) return;

      activePointer = {
        id: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        lastY: e.clientY,
        startTime: performance.now(),
        moved: false
      };
      try { arenaEl.setPointerCapture(e.pointerId); } catch (_) {}
    });

    arenaEl.addEventListener("pointermove", (e) => {
      if (!activePointer || e.pointerId !== activePointer.id) return;
      const dx = e.clientX - activePointer.startX;
      const dy = e.clientY - activePointer.startY;
      activePointer.lastY = e.clientY;
      if (Math.hypot(dx, dy) > 8) activePointer.moved = true;

      const kid = getActiveKid();
      const { bills } = breakdownCents(getEffectiveBalanceCents(kid));

      // Upward pull (dy < 0) previews peeling the top uncounted bill
      if (dy < 0 && ui.countedBillCount < bills.length) {
        const progress = Math.min(1, Math.max(0, -dy / 135));
        ui.isDragging = true;
        ui.dragProgress = progress;
        updateWadLiveTransform(progress);
      } else {
        ui.dragProgress = 0;
        updateWadLiveTransform(0);
      }
    });

    function finishPointer(e, cancelled) {
      if (!activePointer || e.pointerId !== activePointer.id) return;
      const ptr = activePointer;
      activePointer = null;
      ui.isDragging = false;

      if (cancelled) {
        ui.dragProgress = 0;
        render();
        return;
      }

      const dx = e.clientX - ptr.startX;
      const dy = e.clientY - ptr.startY;
      const dist = Math.hypot(dx, dy);
      const dt = Math.max(1, performance.now() - ptr.startTime);
      const vy = dy / dt; // px per ms

      const kid = getActiveKid();
      const { bills } = breakdownCents(getEffectiveBalanceCents(kid));

      // Quick tap counts next bill
      if (!ptr.moved && dist < 10 && dt < 350) {
        ui.dragProgress = 0;
        if (ui.countedBillCount < bills.length) {
          countNextBill();
        } else {
          render();
        }
        return;
      }

      // Check angle from vertical upward (0 deg = straight up, 90 deg = horizontal, 180 deg = straight down)
      const angleFromUp = Math.atan2(Math.abs(dx), -dy) * (180 / Math.PI);

      // Swipe UP to count: requires upward angle < 75 deg and either sufficient pull (>= 62px) or quick flick
      if (dy < -42 && angleFromUp <= 75 && (dy <= -68 || vy <= -0.42)) {
        ui.dragProgress = 0;
        if (ui.countedBillCount < bills.length) {
          countNextBill();
          return;
        }
      }

      // Swipe DOWN to un-count last bill
      const angleFromDown = Math.atan2(Math.abs(dx), dy) * (180 / Math.PI);
      if (dy > 48 && angleFromDown <= 75 && (dy >= 72 || vy >= 0.42)) {
        ui.dragProgress = 0;
        if (ui.countedBillCount > 0) {
          uncountLastBill();
          return;
        }
      }

      // Otherwise settle back without counting
      ui.dragProgress = 0;
      render();
    }

    arenaEl.addEventListener("pointerup", (e) => finishPointer(e, false));
    arenaEl.addEventListener("pointercancel", (e) => finishPointer(e, true));
  }

  function updateWadLiveTransform(progress) {
    const topCard = document.querySelector(".wad-bill-card[data-top-uncounted='1']");
    const readoutEl = document.querySelector(".wad-count-main");
    if (!topCard) return;

    // Bend lower half up & over past 90 degrees toward viewer
    const rotateX = progress * 155;
    const translateY = -progress * 96;
    const scale = 1 - progress * 0.08;
    topCard.style.transform = `translate3d(0, ${translateY.toFixed(1)}px, 0) rotateX(${rotateX.toFixed(1)}deg) scale(${scale.toFixed(3)})`;

    // Swap front/back image past 90 degrees
    const img = topCard.querySelector("img");
    if (img) {
      const targetSrc = progress > 0.58 ? topCard.dataset.backSrc : topCard.dataset.frontSrc;
      if (img.src !== targetSrc) img.src = targetSrc;
    }

    // Tentative gold readout while mid-flip
    if (readoutEl) {
      const kid = getActiveKid();
      const { bills } = breakdownCents(getEffectiveBalanceCents(kid));
      const baseSum = sumPieces(bills.slice(0, ui.countedBillCount));
      const nextBill = bills[ui.countedBillCount] || 0;
      if (progress > 0.08 && nextBill > 0) {
        readoutEl.textContent = formatMoney(baseSum + nextBill, { omitZeroCents: true }) + "…";
        readoutEl.classList.add("tentative");
      } else {
        readoutEl.classList.remove("tentative");
      }
    }
  }

  // ============================================================
  // 7. RENDERING
  // ============================================================
  function render() {
    const kid = getActiveKid();
    document.body.setAttribute("data-theme", kid.theme);

    const effectiveCents = getEffectiveBalanceCents(kid);
    const { bills, coins } = breakdownCents(effectiveCents);
    const coinsTotal = sumPieces(coins);

    // Clamp countedBillCount if balance changed
    if (ui.countedBillCount > bills.length) {
      ui.countedBillCount = bills.length;
    }

    const app = document.getElementById("app");
    let html = "";

    if (storageFailed) {
      html += `<div class="storage-warning">Storage unavailable — changes will not persist after closing.</div>`;
    }

    // Active Preview Striped Banner
    if (ui.preview) {
      const label = ui.preview.type === "send"
        ? `PRETEND · ${escapeHtml(ui.preview.sender)} sends ${formatMoney(ui.preview.addCents, { omitZeroCents: true })}`
        : `PRETEND · Cashier game: ${escapeHtml(ui.preview.itemName)}`;
      html += `
        <div class="preview-banner">
          <div class="preview-banner-text">${label}</div>
          <button class="btn-exit-preview" data-action="exit-preview">Back to real money</button>
        </div>`;
    }

    // Top Kid Tabs + Settings Lock
    html += `
      <div class="top-bar">
        <div class="kid-tabs" role="tablist">
          ${state.kids.map(k => `
            <button class="kid-tab ${k.id === kid.id ? "active" : ""}" data-action="switch-kid" data-kid-id="${k.id}">
              <span>${escapeHtml(k.name)}</span>
              <span class="kid-level-badge">L${k.level}</span>
            </button>
          `).join("")}
        </div>
        <button class="icon-btn" aria-label="Parent settings" data-action="open-settings">🔒</button>
      </div>`;

    // Wallet Header Card
    const isSendPreview = ui.preview && ui.preview.type === "send";
    const balanceDisplay = isSendPreview
      ? `<span class="big-balance preview-shift">${formatMoney(kid.balanceCents)} → ${formatMoney(effectiveCents)}</span>`
      : `<span class="big-balance">${formatMoney(effectiveCents)}</span>`;

    const updatedText = `By parent · updated ${formatRelativeDay(kid.updatedAt)} · Crew sync coming later`;

    html += `
      <div class="wallet-header">
        <div class="balance-row">
          <button class="balance-trigger" data-action="open-set-balance" ${ui.preview ? "disabled" : ""}>
            ${balanceDisplay}
            ${!ui.preview ? `<span class="set-pill">✎ Set</span>` : ""}
          </button>
          <div class="view-toggle" role="tablist">
            <button class="${ui.view === "wad" ? "active" : ""}" data-action="switch-view" data-view="wad">Wad</button>
            <button class="${ui.view === "counter" ? "active" : ""}" data-action="switch-view" data-view="counter">Counter</button>
          </div>
        </div>
        <div class="meta-row">
          <span>${updatedText}</span>
        </div>
      </div>`;

    // "What changed" banner (when not in preview and previous balance differs)
    const diffCents = kid.balanceCents - kid.prevBalanceCents;
    if (!ui.preview && diffCents !== 0) {
      const sinceDay = formatRelativeDay(kid.prevUpdatedAt);
      const changeText = diffCents > 0
        ? `${formatMoney(diffCents, { omitZeroCents: true })} came in since ${sinceDay}`
        : `${formatMoney(Math.abs(diffCents), { omitZeroCents: true })} spent since ${sinceDay}`;
      html += `
        <div class="change-banner">
          <span>${changeText}</span>
          <button class="btn-replay" data-action="replay-change">Replay</button>
        </div>`;
    }

    // Main Stage
    html += `<div class="stage">`;
    if (ui.view === "wad") {
      html += renderWadView(kid, bills, coins, coinsTotal, effectiveCents);
    } else {
      html += renderCounterView(kid, bills, coins, effectiveCents);
    }
    html += `</div>`;

    // Bottom "What if" buttons
    html += `
      <div class="bottom-actions">
        <button class="action-btn" data-action="open-send">Someone's sending money</button>
        <button class="action-btn primary" data-action="open-buy">I want something</button>
      </div>`;

    app.innerHTML = html;

    // Render modal outside #app if open
    const existingModal = document.querySelector(".modal-backdrop");
    if (existingModal) existingModal.remove();
    if (ui.modal) {
      const modalHtml = renderModal(kid);
      if (modalHtml) {
        document.body.insertAdjacentHTML("beforeend", modalHtml);
      }
    }

    // Attach Wad gestures if active
    if (ui.view === "wad") {
      attachWadGestures(document.getElementById("wad-arena"));
    }

    // Clear one-shot replay animation flag after paint
    if (ui.replayAnim) {
      requestAnimationFrame(() => { ui.replayAnim = false; });
    }
  }

  function renderWadView(kid, bills, coins, coinsTotal, effectiveCents) {
    if (effectiveCents === 0) {
      return `
        <div class="wad-view">
          <div class="empty-state">
            <div class="empty-state-title">$0.00 right now</div>
            <div class="empty-state-body">When money comes in, the bills show up here.</div>
          </div>
        </div>`;
    }

    const countedBills = bills.slice(0, ui.countedBillCount);
    const uncountedBills = bills.slice(ui.countedBillCount);
    const countedBillsSum = sumPieces(countedBills);
    const allBillsCounted = uncountedBills.length === 0;

    let readoutMain = "";
    let readoutSub = "";
    if (bills.length === 0) {
      readoutMain = `Coins only: ${formatMoney(coinsTotal, { shortUnderDollar: true })}`;
      readoutSub = `${coins.length} coin${coins.length === 1 ? "" : "s"} in your pocket`;
    } else if (allBillsCounted) {
      readoutMain = `That's all! ${formatMoney(effectiveCents)}`;
      readoutSub = coinsTotal > 0
        ? `${formatMoney(countedBillsSum, { omitZeroCents: true })} in bills + ${formatMoney(coinsTotal, { shortUnderDollar: true })} in coins`
        : `${bills.length} bill${bills.length === 1 ? "" : "s"} counted`;
    } else if (ui.countedBillCount === 0) {
      readoutMain = `Swipe up or tap to count`;
      readoutSub = `${bills.length} bill${bills.length === 1 ? "" : "s"}${coinsTotal > 0 ? ` + ${formatMoney(coinsTotal, { shortUnderDollar: true })} in coins` : ""}`;
    } else {
      readoutMain = `${formatMoney(countedBillsSum, { omitZeroCents: true })}…`;
      readoutSub = `${ui.countedBillCount} of ${bills.length} bills counted`;
    }

    // Counted pile (face-down backs at top)
    const countedHtml = countedBills.slice(-4).map((denom, idx) => {
      const backSrc = getBillImage(denom, "back", kid.theme, kid.name);
      const rot = ((idx % 3) - 1) * 3;
      const offset = idx * 2;
      return `<div class="counted-card" style="background-image:url('${backSrc}'); transform: translateY(${offset}px) rotate(${rot}deg);"></div>`;
    }).join("");

    // Uncounted stack (largest on top, visible stack edges underneath)
    const visibleStack = uncountedBills.slice(0, 6);
    const stackHtml = visibleStack.map((denom, idx) => {
      const frontSrc = getBillImage(denom, "front", kid.theme, kid.name);
      const backSrc = getBillImage(denom, "back", kid.theme, kid.name);
      const zIndex = visibleStack.length - idx;
      const yOff = idx * 6;
      const scale = 1 - idx * 0.018;
      const isTop = idx === 0;
      return `
        <div
          class="wad-bill-card"
          data-top-uncounted="${isTop ? "1" : "0"}"
          data-front-src="${frontSrc}"
          data-back-src="${backSrc}"
          style="z-index:${zIndex}; transform: translate3d(0, ${yOff}px, 0) scale(${scale});"
        >
          <img class="wad-bill-face" src="${frontSrc}" alt="$${denom / 100} bill" draggable="false" />
        </div>`;
    }).reverse().join("");

    // Coin pile beside wad
    const uniqueCoinDenoms = [...new Set(coins)];
    const coinPileHtml = coinsTotal > 0 ? `
      <div class="wad-coin-cluster">
        <div class="wad-coin-icons">
          ${uniqueCoinDenoms.map(c => `<img src="${getCoinImage(c)}" alt="${c}¢ coin" />`).join("")}
        </div>
        <span class="wad-coin-label">+${formatMoney(coinsTotal, { shortUnderDollar: true })}</span>
      </div>` : `<div></div>`;

    return `
      <div class="wad-view">
        <div class="wad-readout">
          <div class="wad-count-main">${readoutMain}</div>
          <div class="wad-count-sub">${readoutSub}</div>
        </div>
        <div class="wad-arena" id="wad-arena">
          <div class="counted-pile-zone">
            ${countedBills.length === 0 ? `<span class="counted-pile-label">Counted bills land here</span>` : countedHtml}
          </div>
          <div class="wad-stack-wrapper">
            ${stackHtml}
          </div>
        </div>
        <div class="wad-bottom-strip">
          <span class="wad-hint">${ui.countedBillCount > 0 ? "Swipe down to un-count" : "Flick up to peel a bill"}</span>
          ${coinPileHtml}
        </div>
      </div>`;
  }

  function renderCounterView(kid, bills, coins, effectiveCents) {
    const isBuy = ui.preview && ui.preview.type === "buy";
    const buy = isBuy ? ui.preview : null;

    if (effectiveCents === 0 && !isBuy) {
      return `
        <div class="counter-view">
          <div class="empty-state">
            <div class="empty-state-title">$0.00 right now</div>
            <div class="empty-state-body">When money comes in, your bills and coins line up on the counter here.</div>
          </div>
        </div>`;
    }

    // Track how many of each denomination are currently in the cashier tray so they leave the counter visually
    const trayCounts = {};
    if (buy && !buy.paid) {
      for (const d of buy.trayPieces) {
        trayCounts[d] = (trayCounts[d] || 0) + 1;
      }
    }

    // Determine added/spent highlight counts if replayAnim is active
    let addedCounts = {};
    let spentBills = [];
    if (ui.replayAnim) {
      if (ui.preview && ui.preview.type === "send") {
        const addedBreakdown = breakdownCents(ui.preview.addCents);
        for (const d of addedBreakdown.bills) addedCounts[d] = (addedCounts[d] || 0) + 1;
      } else if (kid.balanceCents > kid.prevBalanceCents) {
        const diffBreakdown = breakdownCents(kid.balanceCents - kid.prevBalanceCents);
        for (const d of diffBreakdown.bills) addedCounts[d] = (addedCounts[d] || 0) + 1;
      } else if (kid.balanceCents < kid.prevBalanceCents) {
        const spentBreakdown = breakdownCents(kid.prevBalanceCents - kid.balanceCents);
        spentBills = spentBreakdown.bills;
      }
    }

    let html = `<div class="counter-view">`;

    // Cashier Game Panel at top of counter if active
    if (buy) {
      const canAfford = kid.balanceCents >= buy.priceCents;
      if (!canAfford) {
        const shortBy = buy.priceCents - kid.balanceCents;
        html += `
          <div class="cashier-panel">
            <div class="cashier-item-title">${escapeHtml(buy.itemName)} · ${formatMoney(buy.priceCents)}</div>
            <div class="cashier-status">Not yet! You have ${formatMoney(kid.balanceCents)}, it costs ${formatMoney(buy.priceCents)}. Save ${formatMoney(shortBy)} more.</div>
          </div>`;
      } else if (!buy.paid) {
        const traySum = sumPieces(buy.trayPieces);
        const remaining = Math.max(0, buy.priceCents - traySum);
        const covered = traySum >= buy.priceCents;
        html += `
          <div class="cashier-panel">
            <div class="cashier-header">
              <span class="cashier-item-title">${escapeHtml(buy.itemName)} · ${formatMoney(buy.priceCents)}</span>
              <span class="cashier-status">${formatMoney(traySum)} of ${formatMoney(buy.priceCents)}</span>
            </div>
            <div class="wad-count-sub" style="margin:0;">
              ${covered ? "Ready to pay! Tap a piece in the tray to take it back." : `Need ${formatMoney(remaining)} more — tap bills${kid.level === 2 ? " or coins" : ""} below`}
            </div>
            <div class="tray-pieces">
              ${buy.trayPieces.length === 0
                ? `<span class="wad-hint">Handing to the cashier tray (empty)</span>`
                : buy.trayPieces.map((d, idx) => `
                  <button class="tray-piece-btn" data-action="remove-tray" data-idx="${idx}">
                    ${d >= 100 ? `$${d / 100}` : `${d}¢`} ✕
                  </button>
                `).join("")}
            </div>
            <div class="cashier-actions">
              <button class="btn-pay" data-action="cashier-pay" ${covered ? "" : "disabled"}>
                ${covered ? `Pay ${formatMoney(traySum)}` : "Pay"}
              </button>
              ${buy.showMeHint ? `<button class="btn-show-me" data-action="show-me">Show me</button>` : ""}
            </div>
          </div>`;
      } else {
        // Paid! Show change calculation (or Level 2 guess keypad first)
        const tenderSum = sumPieces(buy.tenderPieces);
        const changeSum = sumPieces(buy.changePieces);
        const leftSum = kid.balanceCents - buy.priceCents;
        const needsLevel2Guess = kid.level === 2 && changeSum > 0 && !buy.guessResult;

        if (needsLevel2Guess) {
          html += `
            <div class="cashier-panel">
              <div class="cashier-item-title">You handed ${formatMoney(tenderSum)} for ${formatMoney(buy.priceCents)}</div>
              <div class="cashier-status">Level 2 Challenge: How much change comes back?</div>
              <div class="keypad-display">$${escapeHtml(buy.guessInput || "0.00")}</div>
              <div class="keypad-grid">
                ${["1","2","3","4","5","6","7","8","9",".","0","back"].map(k => `
                  <button class="key-btn" data-action="guess-key" data-key="${k}">${k === "back" ? "⌫" : k}</button>
                `).join("")}
              </div>
              <button class="btn-pay" data-action="submit-guess">Check my change</button>
            </div>`;
        } else {
          const guessBanner = buy.guessResult
            ? (buy.guessResult.correct
              ? `<div style="color:var(--success);font-weight:800;">Nailed it! ${formatMoney(buy.guessResult.actualCents)} change.</div>`
              : `<div style="color:var(--gold);font-weight:800;">Close! You guessed ${formatMoney(buy.guessResult.guessedCents)} — exact change is ${formatMoney(buy.guessResult.actualCents)}.</div>`)
            : "";
          html += `
            <div class="cashier-panel">
              ${guessBanner}
              <div class="cashier-status">${formatMoney(tenderSum)} − ${formatMoney(buy.priceCents)} = ${formatMoney(changeSum)} back</div>
              <div style="font-size:16px;font-weight:800;">You'd have ${formatMoney(leftSum)} left.</div>
              ${buy.changePieces.length > 0 ? `
                <div class="tray-pieces">
                  ${buy.changePieces.map(d => `<span class="tray-piece-btn" style="cursor:default;">+${d >= 100 ? `$${d / 100}` : `${d}¢`}</span>`).join("")}
                </div>` : ""}
            </div>`;
        }
      }
    }

    // Group bills by denomination
    for (const denom of BILL_DENOMS) {
      const totalOfDenom = bills.filter(b => b === denom).length;
      const inTray = trayCounts[denom] || 0;
      const visibleCount = Math.max(0, totalOfDenom - inTray);
      if (visibleCount === 0) continue;

      const frontSrc = getBillImage(denom, "front", kid.theme, kid.name);
      const rowTotal = visibleCount * denom;
      const highlightNew = addedCounts[denom] || 0;

      let fanHtml = "";
      for (let i = 0; i < visibleCount; i++) {
        const rot = ((i % 5) - 2) * 1.4;
        const isNew = ui.replayAnim && i >= visibleCount - highlightNew;
        fanHtml += `
          <div
            class="counter-bill-item ${isNew ? "anim-new" : ""}"
            style="transform: rotate(${rot}deg);"
            data-action="pick-piece"
            data-denom="${denom}"
          >
            <img src="${frontSrc}" alt="$${denom / 100} bill" />
          </div>`;
      }

      html += `
        <div class="counter-row">
          <div class="counter-bills-fan">${fanHtml}</div>
          <div class="counter-row-label">×${visibleCount} · ${formatMoney(rowTotal, { omitZeroCents: true })}</div>
        </div>`;
    }

    // Spent bills fly-off animation row if replayAnim
    if (ui.replayAnim && spentBills.length > 0) {
      html += `
        <div class="counter-row" style="opacity:0.85;">
          <div class="counter-bills-fan">
            ${spentBills.slice(0, 5).map(denom => `
              <div class="counter-bill-item anim-spent">
                <img src="${getBillImage(denom, "front", kid.theme, kid.name)}" alt="Spent bill" />
              </div>
            `).join("")}
          </div>
          <div class="counter-row-label" style="color:var(--danger);">Spent</div>
        </div>`;
    }

    // Group coins below
    const visibleCoinsByDenom = COIN_DENOMS.map(denom => {
      const total = coins.filter(c => c === denom).length;
      const inTray = trayCounts[denom] || 0;
      return { denom, count: Math.max(0, total - inTray) };
    }).filter(g => g.count > 0);

    if (visibleCoinsByDenom.length > 0) {
      html += `<div class="counter-coins-section">`;
      for (const g of visibleCoinsByDenom) {
        const coinImg = getCoinImage(g.denom);
        const canTapCoin = isBuy && !buy.paid && kid.level === 2;
        html += `
          <div
            class="coin-group-card ${isBuy && kid.level === 1 ? "disabled" : ""}"
            ${canTapCoin ? `data-action="pick-piece" data-denom="${g.denom}"` : ""}
          >
            <div class="coin-stack-mini">
              ${Array.from({ length: Math.min(g.count, 5) }).map(() => `<img src="${coinImg}" alt="${g.denom}¢ coin" />`).join("")}
            </div>
            <span class="coin-group-label">${g.count} × ${g.denom}¢</span>
          </div>`;
      }
      html += `</div>`;
    }

    html += `</div>`;
    return html;
  }

  function renderModal(kid) {
    const m = ui.modal;
    if (!m) return "";

    if (m.type === "pin") {
      return `
        <div class="modal-backdrop" data-action="close-modal-backdrop">
          <div class="modal-sheet ${m.error ? "shake" : ""}" onclick="event.stopPropagation()">
            <div class="modal-title-row">
              <div class="modal-title">Parent PIN</div>
              <button class="btn-secondary" data-action="close-modal">Cancel</button>
            </div>
            <div class="wad-count-sub">Enter 4-digit parent PIN</div>
            <div class="pin-dots">
              ${[0, 1, 2, 3].map(i => `<div class="pin-dot ${i < m.input.length ? "filled" : ""}"></div>`).join("")}
            </div>
            <div class="keypad-grid">
              ${["1","2","3","4","5","6","7","8","9","","0","back"].map(k =>
                k === ""
                  ? `<div></div>`
                  : `<button class="key-btn" data-action="pin-key" data-key="${k}">${k === "back" ? "⌫" : k}</button>`
              ).join("")}
            </div>
          </div>
        </div>`;
    }

    if (m.type === "setBalance") {
      const displayVal = m.input === "" ? "0.00" : m.input;
      return `
        <div class="modal-backdrop" data-action="close-modal-backdrop">
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-title-row">
              <div class="modal-title">Set ${escapeHtml(kid.name)}'s Balance</div>
              <button class="btn-secondary" data-action="set-zero">Set to $0</button>
            </div>
            <div class="wad-count-sub">Was ${formatMoney(kid.balanceCents)} · updated ${formatRelativeDay(kid.updatedAt)}</div>
            <div class="keypad-display">$${escapeHtml(displayVal)}</div>
            ${m.statusMsg ? `<div style="color:var(--gold);font-size:14px;font-weight:700;">${escapeHtml(m.statusMsg)}</div>` : ""}
            <div class="keypad-grid">
              ${["1","2","3","4","5","6","7","8","9",".","0","back"].map(k => `
                <button class="key-btn" data-action="bal-key" data-key="${k}">${k === "back" ? "⌫" : k}</button>
              `).join("")}
            </div>
            <div class="row-2">
              <button class="btn-secondary" data-action="close-modal">Cancel</button>
              <button class="btn-primary-modal" data-action="save-balance">Save</button>
            </div>
          </div>
        </div>`;
    }

    if (m.type === "sendModal") {
      const senders = ["Grandma", "Grandpa", "Birthday", "Chores", "Tooth Fairy", "Aunt & Uncle"];
      const amounts = [500, 1000, 2000, 2500, 5000];
      return `
        <div class="modal-backdrop" data-action="close-modal-backdrop">
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-title-row">
              <div class="modal-title">Someone's sending money</div>
              <button class="btn-secondary" data-action="close-modal">Cancel</button>
            </div>
            <div class="wad-count-sub">Who is it from?</div>
            <div class="chip-grid">
              ${senders.map(s => `
                <button class="choice-chip ${m.sender === s ? "selected" : ""}" data-action="pick-sender" data-sender="${s}">${s}</button>
              `).join("")}
            </div>
            <div class="wad-count-sub">How much?</div>
            <div class="chip-grid">
              ${amounts.map(a => `
                <button class="choice-chip ${!m.customInput && m.amountCents === a ? "selected" : ""}" data-action="pick-send-amt" data-amt="${a}">${formatMoney(a, { omitZeroCents: true })}</button>
              `).join("")}
            </div>
            <div class="form-field">
              <label>Or custom amount ($)</label>
              <input class="form-input" id="custom-send-input" inputmode="decimal" placeholder="e.g. 15.50" value="${escapeHtml(m.customInput)}" />
            </div>
            <button class="btn-primary-modal" data-action="confirm-send">Preview money arriving</button>
          </div>
        </div>`;
    }

    if (m.type === "buyModal") {
      return `
        <div class="modal-backdrop" data-action="close-modal-backdrop">
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-title-row">
              <div class="modal-title">I want something</div>
              <button class="btn-secondary" data-action="close-modal">Cancel</button>
            </div>
            <div class="chip-grid" style="grid-template-columns: repeat(2, 1fr);">
              ${PRESET_ITEMS.map(item => `
                <button
                  class="choice-chip ${!m.customPrice && m.itemName === item.name ? "selected" : ""}"
                  data-action="pick-buy-item"
                  data-name="${escapeHtml(item.name)}"
                  data-price="${item.priceCents}"
                >
                  ${escapeHtml(item.name)} · ${formatMoney(item.priceCents)}
                </button>
              `).join("")}
            </div>
            <div class="row-2">
              <div class="form-field">
                <label>Custom item</label>
                <input class="form-input" id="custom-buy-name" placeholder="Toy or book" value="${escapeHtml(m.customName)}" />
              </div>
              <div class="form-field">
                <label>Price ($)</label>
                <input class="form-input" id="custom-buy-price" inputmode="decimal" placeholder="12.99" value="${escapeHtml(m.customPrice)}" />
              </div>
            </div>
            <button class="btn-primary-modal" data-action="confirm-buy">Go to cashier</button>
          </div>
        </div>`;
    }

    if (m.type === "settings") {
      return `
        <div class="modal-backdrop" data-action="close-modal-backdrop">
          <div class="modal-sheet" onclick="event.stopPropagation()">
            <div class="modal-title-row">
              <div class="modal-title">Parent Settings</div>
              <button class="btn-secondary" data-action="close-modal">Done</button>
            </div>
            ${state.kids.map((k, idx) => `
              <div style="padding:10px;border-radius:14px;background:rgba(0,0,0,0.22);display:flex;flex-direction:column;gap:8px;">
                <div style="font-weight:800;font-size:15px;">Child ${idx + 1}</div>
                <div class="row-2">
                  <div class="form-field">
                    <label>Name</label>
                    <input class="form-input" data-setting-name="${k.id}" value="${escapeHtml(k.name)}" />
                  </div>
                  <div class="form-field">
                    <label>Balance ($)</label>
                    <input class="form-input" inputmode="decimal" data-setting-bal="${k.id}" value="${(k.balanceCents / 100).toFixed(2)}" />
                  </div>
                </div>
                <div class="row-2">
                  <div class="form-field">
                    <label>Level</label>
                    <select class="form-input" data-setting-level="${k.id}">
                      <option value="1" ${k.level === 1 ? "selected" : ""}>Level 1 (Bills only)</option>
                      <option value="2" ${k.level === 2 ? "selected" : ""}>Level 2 (Bills + coins + change guess)</option>
                    </select>
                  </div>
                  <div class="form-field">
                    <label>Theme</label>
                    <select class="form-input" data-setting-theme="${k.id}">
                      <option value="deep-sea" ${k.theme === "deep-sea" ? "selected" : ""}>Deep Sea</option>
                      <option value="dojo" ${k.theme === "dojo" ? "selected" : ""}>Dojo</option>
                    </select>
                  </div>
                </div>
              </div>
            `).join("")}

            <div class="row-2">
              <div class="form-field">
                <label>Parent PIN (4 digits)</label>
                <input class="form-input" id="setting-pin" inputmode="numeric" maxlength="4" value="${escapeHtml(state.parentPin)}" />
              </div>
              <div class="form-field">
                <label>Paper & Coin Sound</label>
                <button class="btn-secondary" data-action="toggle-sound">${state.soundEnabled ? "Sound: ON" : "Sound: OFF"}</button>
              </div>
            </div>

            ${m.errorMsg ? `<div style="color:var(--danger);font-size:14px;font-weight:700;">${escapeHtml(m.errorMsg)}</div>` : ""}

            <div class="row-2">
              <button class="btn-secondary" data-action="reset-demo">Reset Demo</button>
              <button class="btn-primary-modal" data-action="save-settings">Save Settings</button>
            </div>
          </div>
        </div>`;
    }

    return "";
  }

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ============================================================
  // 8. GLOBAL EVENT DELEGATION
  // ============================================================
  document.addEventListener("click", (e) => {
    unlockGesture();
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;

    switch (action) {
      case "switch-kid":
        switchKid(target.dataset.kidId);
        break;
      case "switch-view":
        switchView(target.dataset.view);
        break;
      case "exit-preview":
        exitPreview();
        break;
      case "replay-change":
        ui.view = "counter";
        ui.replayAnim = true;
        render();
        break;
      case "open-set-balance":
        if (!ui.preview) openPinPrompt("setBalance");
        break;
      case "open-settings":
        openPinPrompt("settings");
        break;
      case "open-send":
        openSendModal();
        break;
      case "open-buy":
        openBuyModal();
        break;
      case "close-modal":
      case "close-modal-backdrop":
        ui.modal = null;
        render();
        break;
      case "pin-key":
        handlePinDigit(target.dataset.key);
        break;
      case "bal-key":
        handleSetBalanceKey(target.dataset.key);
        break;
      case "set-zero":
        saveNewKidBalance(0);
        break;
      case "save-balance":
        saveNewKidBalance();
        break;
      case "pick-sender":
        if (ui.modal && ui.modal.type === "sendModal") {
          ui.modal.sender = target.dataset.sender;
          render();
        }
        break;
      case "pick-send-amt":
        if (ui.modal && ui.modal.type === "sendModal") {
          ui.modal.amountCents = parseInt(target.dataset.amt, 10);
          ui.modal.customInput = "";
          render();
        }
        break;
      case "confirm-send": {
        const customEl = document.getElementById("custom-send-input");
        const customVal = customEl ? customEl.value.trim() : "";
        let cents = ui.modal.amountCents;
        if (customVal) {
          const parsed = parseDollarInput(customVal);
          if (parsed === null || parsed <= 0) {
            if (customEl) customEl.classList.add("invalid");
            return;
          }
          cents = parsed;
        }
        startSendPreview(ui.modal.sender, cents);
        break;
      }
      case "pick-buy-item":
        if (ui.modal && ui.modal.type === "buyModal") {
          ui.modal.itemName = target.dataset.name;
          ui.modal.priceCents = parseInt(target.dataset.price, 10);
          ui.modal.customPrice = "";
          render();
        }
        break;
      case "confirm-buy": {
        const nameEl = document.getElementById("custom-buy-name");
        const priceEl = document.getElementById("custom-buy-price");
        const customPriceStr = priceEl ? priceEl.value.trim() : "";
        let name = ui.modal.itemName;
        let price = ui.modal.priceCents;
        if (customPriceStr) {
          const parsed = parseDollarInput(customPriceStr);
          if (parsed === null || parsed <= 0) {
            if (priceEl) priceEl.classList.add("invalid");
            return;
          }
          price = parsed;
          name = (nameEl && nameEl.value.trim()) ? nameEl.value.trim() : "Custom Item";
        }
        startBuyPreview(name, price);
        break;
      }
      case "pick-piece":
        addPieceToTray(parseInt(target.dataset.denom, 10));
        break;
      case "remove-tray":
        removeTrayPieceAt(parseInt(target.dataset.idx, 10));
        break;
      case "cashier-pay":
        executeCashierPay();
        break;
      case "show-me":
        triggerShowMe();
        break;
      case "guess-key": {
        const p = ui.preview;
        if (!p || p.type !== "buy" || !p.paid) return;
        const k = target.dataset.key;
        if (k === "back") {
          p.guessInput = p.guessInput.slice(0, -1);
        } else if (k === ".") {
          if (!p.guessInput.includes(".")) p.guessInput = p.guessInput === "" ? "0." : p.guessInput + ".";
        } else {
          const parts = p.guessInput.split(".");
          if (parts.length === 2 && parts[1].length >= 2) return;
          p.guessInput += k;
        }
        render();
        break;
      }
      case "submit-guess":
        submitLevel2Guess();
        break;
      case "toggle-sound":
        state.soundEnabled = !state.soundEnabled;
        saveState();
        render();
        break;
      case "reset-demo":
        state = defaultState();
        saveState();
        ui.modal = null;
        ui.preview = null;
        ui.countedBillCount = 0;
        render();
        break;
      case "save-settings": {
        let valid = true;
        const updates = [];
        for (const k of state.kids) {
          const nameInput = document.querySelector(`[data-setting-name="${k.id}"]`);
          const balInput = document.querySelector(`[data-setting-bal="${k.id}"]`);
          const levelSel = document.querySelector(`[data-setting-level="${k.id}"]`);
          const themeSel = document.querySelector(`[data-setting-theme="${k.id}"]`);

          const parsedBal = parseDollarInput(balInput.value);
          if (parsedBal === null) {
            balInput.classList.add("invalid");
            valid = false;
          } else {
            balInput.classList.remove("invalid");
          }
          updates.push({
            kid: k,
            name: (nameInput.value.trim() || k.name),
            balanceCents: parsedBal,
            level: parseInt(levelSel.value, 10) === 2 ? 2 : 1,
            theme: themeSel.value === "dojo" ? "dojo" : "deep-sea"
          });
        }
        const pinInput = document.getElementById("setting-pin");
        const pinVal = pinInput ? pinInput.value.trim() : "";
        if (!/^\d{4}$/.test(pinVal)) {
          if (pinInput) pinInput.classList.add("invalid");
          valid = false;
        }
        if (!valid) {
          ui.modal.errorMsg = "Please check highlighted fields (valid dollar amount & 4-digit PIN).";
          render();
          return;
        }
        for (const u of updates) {
          u.kid.name = u.name;
          u.kid.level = u.level;
          u.kid.theme = u.theme;
          if (u.balanceCents !== u.kid.balanceCents) {
            u.kid.prevBalanceCents = u.kid.balanceCents;
            u.kid.prevUpdatedAt = u.kid.updatedAt;
            u.kid.balanceCents = u.balanceCents;
            u.kid.updatedAt = new Date().toISOString();
          }
        }
        state.parentPin = pinVal;
        saveState();
        ui.modal = null;
        ui.preview = null;
        ui.countedBillCount = 0;
        render();
        break;
      }
    }
  });

  // Live validation for settings balance inputs
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el && el.dataset && el.dataset.settingBal) {
      const parsed = parseDollarInput(el.value);
      el.classList.toggle("invalid", parsed === null);
    }
  });

  // ============================================================
  // 9. AUTOMATED VERIFICATION HOOK (window.__FM)
  // ============================================================
  window.__FM = {
    breakdownCents,
    computeNaturalTender,
    parseDollarInput,
    formatMoney,
    getState: () => JSON.parse(JSON.stringify(state)),
    getUI: () => JSON.parse(JSON.stringify(ui)),
    actions: {
      switchKid,
      switchView,
      countNextBill,
      uncountLastBill,
      startSendPreview,
      startBuyPreview,
      addPieceToTray,
      removeTrayPieceAt,
      triggerShowMe,
      executeCashierPay,
      exitPreview,
      setKidBalanceDirect: (kidId, cents) => {
        const k = state.kids.find(x => x.id === kidId);
        if (!k) return;
        k.prevBalanceCents = k.balanceCents;
        k.prevUpdatedAt = k.updatedAt;
        k.balanceCents = cents;
        k.updatedAt = new Date().toISOString();
        saveState();
        ui.countedBillCount = 0;
        ui.view = "counter";
        ui.replayAnim = true;
        render();
      }
    }
  };

  // Initial render + prewarm bill images
  render();
  for (const d of BILL_DENOMS) {
    getBillImage(d, "front", "deep-sea", "Everest");
    getBillImage(d, "back", "deep-sea", "Everest");
    getBillImage(d, "front", "dojo", "Orion");
    getBillImage(d, "back", "dojo", "Orion");
  }
})();
</script>
</body>
</html>
